[project]
name = "secondsmatter"
version = "0.1.0"
description = "AI-powered decision-support prototype for simulated emergency resource planning and dispatch (NOVA IMS Capstone, academic simulation only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "streamlit==1.67.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
# Installed by default (`uv sync`), so the deployed app gets these too.
dev = [
    "pytest==9.2.0",
]
# Not a default group: only `uv sync --group notebooks` installs it, which keeps
# the Jupyter stack out of the deployment.
notebooks = [
    "ipykernel==7.4.0",
]
