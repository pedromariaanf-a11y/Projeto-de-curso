[project]
name = "secondsmatter"
version = "0.1.0"
description = "AI-powered decision-support prototype for simulated emergency resource planning and dispatch (NOVA IMS Capstone, academic simulation only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv==1.2.4",
    "streamlit==1.67.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
